build:
  dev:
    context: .
    target: dev
  hello-world:
    context: .
    target: prod
    depends_on:
      - dev

deploy:
  - envsubst < k8s.yml | kubectl apply -f -

test:
  unit:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    caches:
      - /root/.gradle
    commands:
      - ./gradlew test
    artifacts:
      - build/reports/tests/test

dev:
  hello-world:
    image: ${OKTETO_BUILD_DEV_IMAGE}
    command: sh -c "./gradlew --console=plain --continuous classes & ./gradlew --console=plain bootRun"
    sync:
      - .:/usr/src/app
    persistentVolume:
      enabled: false
    forward:
      - 5005:5005
